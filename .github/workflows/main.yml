name: Mod Eaglercraft HTML

on:
  workflow_dispatch:
    inputs:
      html_url:
        description: Link to the unminified, unobfuscated, unsigned Eaglercraft HTML file
        required: false
        default: https://github.com/Eaglercraft-Archive/unminified-eaglercraft-builds-1.12/releases/download/u2/Eaglercraft_1.12_Offline_International.html
  push:
    paths:
      - ".github/workflows/mod-eaglercraft.yml"

permissions:
  contents: write

jobs:
  mod:
    runs-on: ubuntu-latest

    steps:
      - name: Check out EaglerForgeInjector
        uses: actions/checkout@v4
        with:
          repository: eaglerforge/EaglerForgeInjector
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download Eaglercraft HTML
        env:
          HTML_URL: ${{ inputs.html_url || 'https://github.com/Eaglercraft-Archive/unminified-eaglercraft-builds-1.12/releases/download/u2/Eaglercraft_1.12_Offline_International.html' }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output source.html \
            "$HTML_URL"
          test -s source.html
          echo "HTML_URL=$HTML_URL" >> "$GITHUB_ENV"

      - name: Inject EaglerForge
        run: |
          npm run efi -- source.html modded.html /eaglerforge
          test -s modded.html

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          HTML_URL: ${{ env.HTML_URL }}
        run: |
          TAG="eaglercraft-mod-${GITHUB_RUN_ID}"
          gh release create "$TAG" modded.html \
            --repo "$GITHUB_REPOSITORY" \
            --title "Modded Eaglercraft HTML" \
            --notes "Source HTML: $HTML_URL"
