<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navidrome Server Controller</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; background: #121212; color: #e0e0e0; text-align: center; }
        .card { background: #1e1e1e; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        button { background: #0076ff; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 20px; transition: 0.2s; }
        button:disabled { background: #333; color: #777; cursor: not-allowed; }
        .status { margin: 20px 0; font-size: 18px; font-weight: bold; }
        .url-box { margin-top: 25px; padding: 15px; background: #2a2a2a; border-radius: 6px; word-break: break-all; display: none; }
        .url-box a { color: #00aaff; text-decoration: none; font-weight: bold; }
        input { width: 100%; padding: 10px; margin-top: 10px; background: #2a2a2a; color: white; border: 1px solid #444; border-radius: 6px; box-sizing: border-box; }
    </style>
</head>
<body>

<div class="card">
    <h2>Navidrome Server Manager</h2>
    
    <div style="text-align: left; margin-bottom: 20px;">
        <label>GitHub Personal Access Token (PAT):</label>
        <input type="password" id="patInput" placeholder="ghp_xxxxxxxxxxxx" onchange="saveToken()">
        <small style="color: #888;">Stored only locally in your browser.</small>
    </div>

    <div class="status">Server Status: <span id="statusText">Checking...</span></div>
    
    <div id="urlContainer" class="url-box">
        🎵 Navidrome Link:<br>
        <a id="tunnelLink" href="#" target="_blank">Loading link...</a>
    </div>

    <button id="actionBtn" onclick="triggerWorkflow()" disabled>Start Navidrome</button>
</div>

<script>
// Configure your details here
const OWNER = "Minecatl1"; 
const REPO = "YOUR_REPOSITORY_NAME"; // Replace with your actual repository name
const WORKFLOW_ID = "deploy.yml";     // The filename of your workflow YAML file

function saveToken() {
    localStorage.setItem('gh_pat', document.getElementById('patInput').value);
    checkServerStatus();
}

async function fetchGH(endpoint, options = {}) {
    const token = localStorage.getItem('gh_pat') || document.getElementById('patInput').value;
    if (!token) return null;
    
    const res = await fetch(`https://github.com{OWNER}/${REPO}/${endpoint}`, {
        ...options,
        headers: {
            'Authorization': `Bearer ${token}`,
            'Accept': 'application/vnd.github+json',
            ...options.headers
        }
    });
    return res.ok ? res.json() : null;
}

async function checkServerStatus() {
    const token = localStorage.getItem('gh_pat');
    if (!token) {
        document.getElementById('statusText').innerText = "Please enter a GitHub PAT";
        document.getElementById('actionBtn').disabled = true;
        return;
    }

    const data = await fetchGH(`actions/workflows/${WORKFLOW_ID}/runs?per_page=1`);
    if (!data || !data.workflow_runs.length) {
        document.getElementById('statusText').innerText = "No runs found.";
        document.getElementById('actionBtn').disabled = false;
        return;
    }

    const latestRun = data.workflow_runs[0];
    const status = latestRun.status;
    const conclusion = latestRun.conclusion;

    const statusText = document.getElementById('statusText');
    const actionBtn = document.getElementById('actionBtn');
    const urlContainer = document.getElementById('urlContainer');

    if (status === 'queued' || status === 'in_progress') {
        statusText.innerText = "⚡ Running (Navidrome is Active)";
        statusText.style.color = "#00ff66";
        actionBtn.disabled = true;
        actionBtn.innerText = "Server is Online";
        
        // Attempt to fetch the URL artifact if it exists yet
        fetchTunnelUrl(latestRun.id);
    } else {
        statusText.innerText = "🛑 Offline";
        statusText.style.color = "#ff3b30";
        actionBtn.disabled = false;
        actionBtn.innerText = "Start Navidrome";
        urlContainer.style.display = "none";
    }
}

async function triggerWorkflow() {
    document.getElementById('actionBtn').disabled = true;
    document.getElementById('statusText').innerText = "Requesting startup...";
    
    const success = await fetchGH(`actions/workflows/${WORKFLOW_ID}/dispatches`, {
        method: 'POST',
        body: JSON.stringify({ ref: 'main' }) // Change to your default branch name if not main
    });

    // API returns 204 No Content on success, which returns null in our helper
    setTimeout(checkServerStatus, 3000);
}

async function fetchTunnelUrl(runId) {
    const urlContainer = document.getElementById('urlContainer');
    const tunnelLink = document.getElementById('tunnelLink');
    
    const artifactData = await fetchGH(`actions/runs/${runId}/artifacts`);
    if (!artifactData || !artifactData.artifacts.length) {
        urlContainer.style.display = "block";
        tunnelLink.innerText = "Generating tunnel URL... (takes ~30 seconds)";
        tunnelLink.removeAttribute('href');
        return;
    }

    const targetArtifact = artifactData.artifacts.find(a => a.name === 'live-tunnel-url');
    if (targetArtifact) {
        // We cannot directly read artifact text content over API due to zip compression.
        // Instead, as a backup to avoid complex unzipping in JS, we notify the user 
        // that they can jump to logs or use a simple alternative tracking method if preferred.
        tunnelLink.href = `https://github.com{OWNER}/${REPO}/actions/runs/${runId}`;
        tunnelLink.innerText = "Click here to view Action Details & URL Output";
        urlContainer.style.display = "block";
    }
}

// Load initial states
document.getElementById('patInput').value = localStorage.getItem('gh_pat') || '';
checkServerStatus();
setInterval(checkServerStatus, 15000); // Poll every 15 seconds
</script>
</body>
</html>
